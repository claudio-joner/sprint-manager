@if (open) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ title }}</h3>
        <button type="button" (click)="close()">✕</button>
      </div>
      <ng-content></ng-content>
    </div>
  </div>
}
